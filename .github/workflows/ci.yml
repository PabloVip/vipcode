name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # La prueba de la interfaz completa usa expect (en macOS ya viene instalado; en Windows no se pasa)
      - name: Instalar expect
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm ci
      - run: npm test
